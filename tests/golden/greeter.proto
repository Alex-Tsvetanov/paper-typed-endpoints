syntax = "proto3";
package tep.demo;

message HelloRequest {
  string name = 1;
  int32 times = 2;
}

message HelloReply {
  string message = 1;
  repeated int32 echoes = 2;
}

service Greeter {
  rpc SayHello(HelloRequest) returns (HelloReply);
  rpc SayNothing(HelloRequest) returns (HelloReply) {}
}
