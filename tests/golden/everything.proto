syntax = "proto3";
package tep.test;

enum Color {
  COLOR_UNSPECIFIED = 0;
  RED = 1;
  GREEN = 2;
  NEG = -3;
}

message Inner {
  int32 id = 1;
  string label = 2;
}

message Everything {
  int32 out_of_order = 100;  // declared first, encoded by field number
  double f_double = 1;
  float f_float = 2;
  int64 f_int64 = 3;
  uint64 f_uint64 = 4;
  int32 f_int32 = 5;
  fixed64 f_fixed64 = 6;
  fixed32 f_fixed32 = 7;
  bool f_bool = 8;
  string f_string = 9;
  bytes f_bytes = 10;
  uint32 f_uint32 = 11;
  sfixed32 f_sfixed32 = 12;
  sfixed64 f_sfixed64 = 13;
  sint32 f_sint32 = 14;
  sint64 f_sint64 = 15;
  Color f_enum = 16;
  Inner f_inner = 17;
  repeated int32 r_int32 = 18;
  repeated sint64 r_sint64 = 19;
  repeated fixed32 r_fixed32 = 20;
  repeated double r_double = 21;
  repeated bool r_bool = 22;
  repeated Color r_enum = 23;
  repeated string r_string = 24;
  repeated bytes r_bytes = 25;
  repeated Inner r_inner = 26;
  repeated int32 r_unpacked = 27 [packed = false];
  int32 class = 28;
  uint32 big_number = 536870911;
}
